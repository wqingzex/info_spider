ai:
  # Gemini（优先，免费）：https://aistudio.google.com/app/apikey
  gemini_model: "gemini-2.0-flash-lite"   # 免费：1500次/天，30 RPM
  # gemini_model: "gemini-2.0-flash"       # 免费：1500次/天，15 RPM，质量更高
  # gemini_model: "gemini-2.5-flash"       # 免费：500次/天，推理更强

  # Claude（备用，付费/CLI额度）
  model: "claude-haiku-4-5-20251001"

  max_tokens: 1024

output:
  base_dir: "output"
  data_dir: "data"
  seen_urls_file: "data/seen_urls.json"
  max_seen_urls: 10000

http:
  timeout: 20
  retries: 2
  delay_between_requests: 1.5
  headers:
    User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
