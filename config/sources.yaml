# VLA & 具身智能信息源配置

arxiv:
  categories:
    - cs.RO   # Robotics
    - cs.AI   # Artificial Intelligence
    - cs.CV   # Computer Vision
    - cs.LG   # Machine Learning
  keywords:
    - "VLA"
    - "vision language action"
    - "embodied intelligence"
    - "embodied AI"
    - "robot learning"
    - "humanoid robot"
    - "manipulation policy"
    - "imitation learning robot"
    - "diffusion policy"
    - "lerobot"
    - "foundation model robot"
    - "world model robot"
    - "reinforcement learning robot"
    - "RL robot manipulation"
    - "sim-to-real"
    - "dexterous manipulation"
  max_results: 50
  days_back: 2

